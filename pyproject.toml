[project]
name = "mle-data-pipeline-project"
version = "0.1.0"
requires-python = ">=3.13.14"
dependencies = [
    "click>=8.5.0",
    "pandas>=3.0.5",
    "prefect>=3.8.6",
    "pyarrow>=25.0.1",
    "requests>=2.34.2",
]

[dependency-groups]
dev = [
    "ipykernel>=7.3.0",
    "pytest>=9.1.1",
]

[tool.ty.environment]
root = [".", "solution/src"]

[tool.uv]
required-version = ">=0.11.26"
# Apply certificate fixes without adding unused runtime packages.
# Prefect's server still uses FastAPI's removed min_items argument.
constraint-dependencies = ["certifi>=2026.10.19", "pip>=26.2.2", "fastapi<0.155"]

[build-system]
requires = ["uv_build>=0.11.26,<0.12"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-name = "data_pipeline"
